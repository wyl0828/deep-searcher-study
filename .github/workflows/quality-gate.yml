name: Project quality gate

on:
  push:
    branches: [study-baseline]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run fast quality gate
        shell: pwsh
        run: >-
          ./scripts/run-quality-gate.ps1
          -Mode Fast
          -InstallDependencies
          -OutputDir tmp/quality-gate/ci

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-${{ github.run_id }}
          path: |
            tmp/quality-gate/ci
            output/playwright/e2e-results
            output/playwright/e2e-report
          if-no-files-found: warn
          retention-days: 14

site_name: DeepSearcher Study
repo_name: wyl0828/deep-searcher-study
repo_url: https://github.com/wyl0828/deep-searcher-study

theme:
  name: material
  language: zh
  custom_dir: docs/覆盖模板
  palette:
    # 跟随系统主题
    - media: "(prefers-color-scheme)"
      scheme: default
      primary: black
      toggle:
        icon: material/brightness-auto
        name: 切换到浅色模式

    # 浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式

    # 深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: 跟随系统设置

  logo: assets/pic/logo-badge.png
  favicon: assets/pic/logo-badge.png
  features:
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - announce.dismiss
    - navigation.footer
    - navigation.tabs
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - toc.follow

nav:
  - 首页:
    - "项目首页": index.md
    - "安装":
      - "安装说明": 安装/index.md
      - "使用 pip 安装": 安装/pip.md
      - "开发模式": 安装/development.md
    - "常见问题":
      - "常见问题": 常见问题/index.md
  - 贡献指南:
    - "贡献指南": 贡献指南/index.md
  - 使用指南:
    - "使用概览": 使用指南/index.md
    - "快速开始": 使用指南/quick_start.md
    - "命令行工具": 使用指南/cli.md
    - "部署": 使用指南/deployment.md
    - "服务器部署与验收": 部署/服务器部署与验收.md
  - 示例:
    - "示例概览": 示例/index.md
    - "基础示例": 示例/basic_example.md
    - "Docling 集成": 示例/docling.md
    - "Unstructured 集成": 示例/unstructured.md
    - "FireCrawl 集成": 示例/firecrawl.md
    - "Oracle 示例": 示例/oracle.md
  - 配置:
    - "配置概览": 配置/index.md
    - "LLM 模型": 配置/llm.md
    - "Embedding 模型": 配置/embedding.md
    - "向量数据库": 配置/vector_db.md
    - "文件加载器": 配置/file_loader.md
    - "网页抓取器": 配置/web_crawler.md
  - 模块:
    - "集成模块支持": 集成/index.md
  - 后续计划:
    - "后续计划": future_plans.md
  - 项目维护:
    - "可信 RAG 路线图": roadmap/trustworthy-rag-roadmap.md
    - "Trust Layer 契约": adr/0001-trust-layer-contract.md
    - "Answer Policy": adr/0002-answer-policy-engine.md
    - "确定性一致性": adr/0003-deterministic-consistency-checker.md
    - "Citation Span": adr/0004-citation-span-mapper.md
    - "Entailment Checker": adr/0005-entailment-checker.md
    - "Query Risk Profile": adr/0006-query-risk-profile.md
    - "Trust Provenance": adr/0007-trust-trace-provenance.md
    - "Freshness Policy": adr/0008-freshness-policy.md
    - "文档版本系列": adr/0009-document-version-family.md
    - "Knowledge Health 契约": adr/0010-knowledge-health-contract.md

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - admonition
  - pymdownx.details
  - attr_list
  - mkdocs-click
  - md_in_html
  - tables
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.highlight

plugins:
  - search
  - mkdocs-jupyter

extra_css:
  - 样式/extra.css

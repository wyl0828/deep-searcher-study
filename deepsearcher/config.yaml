query_settings:
  max_iter: 2
  document_aware_query_decomposition:
    # Promoted only after the focused and full v0.3 quality gates pass.
    enabled: false
  trust:
    temporal:
      # Relative dates in answers are resolved against this request-clock timezone.
      timezone: "Asia/Shanghai"
    entailment:
      # Opt-in: one bounded batch call for claims not resolved by deterministic checks.
      enabled: false
      provider: "llm"
      # deepseek-v4-flash / checker 1.2 / Gold 1.1.0 calibration recommendation.
      min_confidence: 0.90
  deep_search:
    web_search_queries_per_iteration: 2
    web_search_results_per_query: 5
  chain_of_rag:
    early_stopping: true
    min_evidence_for_stop: 2

load_settings:
  chunk_size: 1500
  chunk_overlap: 100

      # include_domains: ["example.com"]  # Optional trusted-source allowlist.
      # exclude_domains: ["spam.example"]

  vector_db:
    provider: "Milvus"
    config:
      default_collection: "deepsearcher"
      uri: "http://127.0.0.1:19530"
      token: "root:Milvus"
      db: "default"
      # workspace_v2@2.2.0 三重复门禁已通过；旧 Dense-only 知识库需重建后才能使用。
      hybrid: true
      rrf_k: 5
      hybrid_ranker: "weighted_rrf"
      hybrid_dense_weight: 1.5
      hybrid_sparse_weight: 1.0
      hybrid_candidate_multiplier: 1
      hybrid_dense_anchor_count: 2
      hybrid_diversity_tolerance: 0.0

